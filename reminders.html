<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
        }

        .app-wrap {
            max-width: 430px;
            margin: 0 auto;
            background: #111111;
            min-height: 100vh;
            position: relative;
        }

        .app-header {
            padding: 24px 20px 16px;
            background: #151515;
        }

        .status-tag {
            display: inline-block;
            background: #a855f7;
            color: #fff;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .header-day {
            font-size: 24px;
            font-weight: 600;
        }

        .day-tabs {
            display: flex;
            justify-content: space-around;
            padding: 12px 8px;
            background: #151515;
            border-bottom: 1px solid #222;
        }

        .day-tab {
            font-size: 14px;
            color: #777;
            width: 32px;
            text-align: center;
        }

        .day-tab.active {
            color: #fff;
            font-weight: 600;
        }

        .reminder-container {
            padding: 16px;
            padding-bottom: 100px;
        }

        .reminder-card {
            display: flex;
            background: #1e1e1e;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .color-side-bar {
            width: 6px;
        }

        .card-content {
            flex: 1;
            padding: 14px 12px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .card-time {
            font-size: 13px;
            color: #aaa;
        }

        .card-notes {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-right: 12px;
        }

        .del-btn {
            background: transparent;
            border: none;
            color: #ff4444;
            font-size: 18px;
            cursor: pointer;
        }

        .empty-text {
            text-align: center;
            color: #666;
            padding: 60px 0;
            font-size: 15px;
        }

        .floating-add {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
            z-index: 5;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: #1e1e1e;
            width: 100%;
            max-width: 380px;
            border-radius: 20px;
            padding: 24px;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-head h2 {
            font-size: 18px;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            background: #2a2a2a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        .form-group textarea {
            min-height: 70px;
            resize: none;
        }

        .time-row {
            display: flex;
            gap: 10px;
        }

        .time-row input {
            flex: 1;
        }

        .color-picker-row {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.active {
            border-color: #ffffff;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="app-wrap">
        <div class="app-header">
            <span class="status-tag">Updating Soon</span>
            <div class="header-day">Monday</div>
        </div>

        <div class="day-tabs">
            <div class="day-tab">S</div>
            <div class="day-tab active">M</div>
            <div class="day-tab">T</div>
            <div class="day-tab">W</div>
            <div class="day-tab">T</div>
            <div class="day-tab">F</div>
            <div class="day-tab">S</div>
        </div>

        <div class="reminder-container" id="reminderList">
            <p class="empty-text">No reminders yet</p>
        </div>

        <button class="floating-add" onclick="openModal()">+</button>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-box">
            <div class="modal-head">
                <h2>New Reminder</h2>
                <button class="close-modal" onclick="closeModal()">×</button>
            </div>

            <div class="form-group">
                <label>Reminder Name</label>
                <input type="text" id="remName" placeholder="Enter title">
            </div>

            <div class="form-group">
                <label>Additional Notes</label>
                <textarea id="remNotes" placeholder="Add notes here"></textarea>
            </div>

            <div class="form-group">
                <label>Date & Time</label>
                <div class="time-row">
                    <input type="date" id="remDate">
                    <input type="time" id="remTime">
                </div>
            </div>

            <div class="form-group">
                <label>Select Color</label>
                <div class="color-picker-row" id="colorRow">
                    <div class="color-dot active" style="background:#3b82f6" data-color="#3b82f6"></div>
                    <div class="color-dot" style="background:#a855f7" data-color="#a855f7"></div>
                    <div class="color-dot" style="background:#10b981" data-color="#10b981"></div>
                    <div class="color-dot" style="background:#ef4444" data-color="#ef4444"></div>
                    <div class="color-dot" style="background:#eab308" data-color="#eab308"></div>
                </div>
            </div>

            <button class="save-btn" onclick="saveReminder()">Save Reminder</button>
        </div>
    </div>

    <script>
        let pickColor = "#3b82f6";
        let reminderList = [];

        window.onload = function() {
            let stored = localStorage.getItem("myReminders");
            if (stored) {
                reminderList = JSON.parse(stored);
            }
            renderAll();
            Notification.requestPermission();
        };

        document.querySelectorAll(".color-dot").forEach(dot => {
            dot.addEventListener("click", function(){
                document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
                this.classList.add("active");
                pickColor = this.dataset.color;
            });
        });

        function openModal(){
            document.getElementById("addModal").style.display = "flex";
        }
        function closeModal(){
            document.getElementById("addModal").style.display = "none";
        }

        function saveReminder(){
            const name = document.getElementById("remName").value.trim();
            const notes = document.getElementById("remNotes").value.trim();
            const date = document.getElementById("remDate").value;
            const time = document.getElementById("remTime").value;

            if(name === ""){
                alert("Please enter a reminder name!");
                return;
            }
            if(date === "" || time === ""){
                alert("Please pick date and time!");
                return;
            }

            const targetDT = new Date(date + "T" + time);
            const now = new Date();

            if(targetDT <= now){
                alert("Please choose a future time!");
                return;
            }

            const newItem = {
                id: Date.now(),
                title: name,
                note: notes,
                d: date,
                t: time,
                color: pickColor
            };

            reminderList.push(newItem);
            localStorage.setItem("myReminders", JSON.stringify(reminderList));

            const delay = targetDT - now;
            setTimeout(() => {
                new Notification("🔔 Reminder", {
                    title: name,
                    body: notes || "No additional notes"
                });
            }, delay);

            closeModal();
            clearForm();
            renderAll();
        }

        function clearForm(){
            document.getElementById("remName").value = "";
            document.getElementById("remNotes").value = "";
            document.getElementById("remDate").value = "";
            document.getElementById("remTime").value = "";
            pickColor = "#3b82f6";
            document.querySelectorAll(".color-dot").forEach(d => d.classList.remove("active"));
            document.querySelector('.color-dot[data-color="#3b82f6"]').classList.add("active");
        }

        function renderAll(){
            const wrap = document.getElementById("reminderList");
            if(reminderList.length === 0){
                wrap.innerHTML = '<p class="empty-text">No reminders yet</p>';
                return;
            }

            let html = "";
            reminderList.forEach(item => {
                html += `
                <div class="reminder-card">
                    <div class="color-side-bar" style="background:${item.color}"></div>
                    <div class="card-content">
                        <div class="card-title">${escapeTxt(item.title)}</div>
                        <div class="card-time">${item.t}</div>
                        ${item.note ? `<div class="card-notes">${escapeTxt(item.note)}</div>` : ""}
                    </div>
                    <div class="card-actions">
                        <button class="del-btn" onclick="deleteItem(${item.id})">✕</button>
                    </div>
                </div>
                `;
            });
            wrap.innerHTML = html;
        }

        function deleteItem(id){
            reminderList = reminderList.filter(x => x.id !== id);
            localStorage.setItem("myReminders", JSON.stringify(reminderList));
            renderAll();
        }

        function escapeTxt(str){
            if(!str) return "";
            return str.replace(/</g,"&lt;").replace(/>/g,"&gt;");
        }
    </script>
</body>
</html>
